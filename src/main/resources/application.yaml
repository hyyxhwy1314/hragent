# 对象存储（COS）配置
cos:
  client:
    access-key: ${COS_ACCESS_KEY:}
    secret-key: ${COS_SECRET_KEY:}
    region: ap-shanghai
    bucket: mycos-1398812003
    # 文件存储目录前缀
    prefix: resume/
    # 预签名 URL 有效期（秒）
    expire: 3600

# Python AI分析服务配置
python:
  ai:
    service:
      url: http://127.0.0.1:8000
aliyun:
  ocr:
    # 阿里云 OCR 凭据（与 COS 可共用同一主账号 AK/SK，但权限需开通 OCR 服务：
    #  https://www.aliyun.com/product/ocr 并授权 AliyunOCRFullAccess）
    # 为空时：扫描件会记录 WARN 日志但不抛异常，PDF 文本档仍可走 PDFBox
    access-key-id: ${ALIYUN_OCR_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OCR_ACCESS_KEY_SECRET:}
    endpoint: ocr-api.cn-hangzhou.aliyuncs.com
    region-id: cn-shanghai
    # 扫描件 PDF 识别时，最多渲染前 N 页（限制一次上传的渲染开销，默认 5）
    pdf-max-pages: 5
    # 渲染 DPI（越大越清晰，但 OCR 耗时越长），推荐 220-300
    render-dpi: 240
    # RecognizeAllText 图片类型：Advanced=通用文字识别高精版（支持图片+PDF，准确率最高）
    type: Advanced

# LangChain4j & AI Model Configuration
# 使用阿里云 MaaS 兼容模式 (OpenAI-compatible endpoint)
ai:
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://llm-8sr4ofm58q8qaj4e.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  model:
    name: ${AI_MODEL_NAME:qwen3.8-max}
  # 向量化模型：与对话模型共用同一 OpenAI 兼容端点（同 base-url/api-key），仅模型名不同
  # 输出维度需与 hragent.rag.qdrant.vector-dim(1024) 保持一致，切换模型后需 reindex 重建向量
  embedding:
    model:
      name: ${AI_EMBEDDING_MODEL_NAME:qwen3.7-text-embedding-flash}
  # 本地轻量决策模型：只用于工具路由的「业务域分类」这一层决策，最终作答与工具参数生成仍由远程模型负责。
  # 走本机 Ollama 的 OpenAI 兼容端点（本机部署在 D 盘），默认关闭；
  # 开启后若调用失败/超时/输出非法，自动回退规则分类，不影响主链路。
  routing:
    enabled: ${AI_ROUTING_ENABLED:false}
    base-url: ${AI_ROUTING_BASE_URL:http://127.0.0.1:11434/v1}
    model-name: ${AI_ROUTING_MODEL_NAME:qwen2.5:3b-instruct}
    # Ollama 不校验密钥，此处仅为满足 OpenAI 兼容客户端必填项
    api-key: ${AI_ROUTING_API_KEY:ollama}
    timeout-seconds: ${AI_ROUTING_TIMEOUT_SECONDS:20}
    # 只读工具优先：让本地模型接管「只读/查询类工具」的选工具 + 生成参数这一跳，命中时跳过远程模型首跳。
    # 写操作与流程类工具（发起流程/审批/登记简历等）仍由远程模型选定。依赖 routing.enabled=true，故两者需同时开启。
    # 关闭（默认）时行为与启用前完全一致。
    planning:
      enabled: ${AI_ROUTING_PLANNING_ENABLED:false}
    # 全量本地化：把 Agent 主模型（最终作答、工具参数生成，以及简历深度分析、合同审查等）
    # 切换为本地模型。远程 API 模型的 Bean 与凭据配置保留不变（api 先保留），关闭本开关即一键切回。
    # 提示：主模型本地化后，「本地域分类 / 本地只读规划」两项优化的目的（省远程 token）已不适用，
    # 建议保持 ai.routing.enabled=false（域分类走规则），避免每轮多出多余的本地调用与延迟。
    local-primary: ${AI_ROUTING_LOCAL_PRIMARY:false}
    # 全量本地化时本地主模型的超时（秒）；本地 CPU 推理较慢，需给足时间，否则作答易被截断。
    llm-timeout-seconds: ${AI_ROUTING_LLM_TIMEOUT_SECONDS:300}

