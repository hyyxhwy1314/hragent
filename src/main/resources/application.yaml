spring:
  aop:
    proxy-target-class: true
    auto: true
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # QQ 邮箱 SMTP：用于入职流程发送通知邮件
  # password 是 QQ 邮箱的 SMTP 授权码（不是 QQ 密码），需到 QQ 邮箱设置→账户→POP3/SMTP 服务开通后获取
  mail:
    host: smtp.qq.com
    port: 465
    username: 2670556804@qq.com
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
  # MySQL‑douban‑mysql 13306
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/hr_agent_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: Admin@888888

  # Redis douban‑redis 宿主机16379
  # RabbitMQ douban‑rabbitmqAdmin@888888
  #  rabbitmq:
  #    host: 127.0.0.1
  #    port: 15672
  #    username: guest
  #    password: guest
  # Redis douban‑redis 宿主机16379
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: 123
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms

# JWT 鉴权配置
hragent:
  jwt:
    secret: hragent-secret-key-for-jwt-signing-must-be-long-enough-2026
    expire-hours: 24

flowable:
  database-schema-update: true
  history-level: full
  # 自动节点（ServiceTask）异步触发，原 false 会导致流程卡在自动节点
  async-executor-activate: true
  process-definition-cache-limit: 100
  # 历史归档保留 180 天
  history-time-to-live: P180D

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.hragent.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    org.example.hragent: DEBUG
    com.baomidou.mybatisplus: WARN
    org.flowable: WARN
    org.apache.ibatis: WARN

# Elasticsearch7.17.9
#elasticsearch:
#  address: 127.0.0.1
#  port: 9200

# 对象存储（COS）配置
cos:
  client:
    access-key: ${COS_ACCESS_KEY:}
    secret-key: ${COS_SECRET_KEY:}
    region: ap-shanghai
    bucket: mycos-1398812003
    # 文件存储目录前缀
    prefix: resume/
    # 预签名 URL 有效期（秒）
    expire: 3600

# Python AI分析服务配置
python:
  ai:
    service:
      url: http://127.0.0.1:8000
aliyun:
  ocr:
    # 阿里云 OCR 凭据（与 COS 可共用同一主账号 AK/SK，但权限需开通 OCR 服务：
    #  https://www.aliyun.com/product/ocr 并授权 AliyunOCRFullAccess）
    # 为空时：扫描件会记录 WARN 日志但不抛异常，PDF 文本档仍可走 PDFBox
    access-key-id: ${ALIYUN_OCR_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OCR_ACCESS_KEY_SECRET:}
    endpoint: ocr-api.cn-hangzhou.aliyuncs.com
    region-id: cn-shanghai
    # 扫描件 PDF 识别时，最多渲染前 N 页（限制一次上传的渲染开销，默认 5）
    pdf-max-pages: 5
    # 渲染 DPI（越大越清晰，但 OCR 耗时越长），推荐 220-300
    render-dpi: 240
    # RecognizeAllText 图片类型：Advanced=通用文字识别高精版（支持图片+PDF，准确率最高）
    type: Advanced

# LangChain4j & AI Model Configuration
# 使用阿里云 MaaS 兼容模式 (OpenAI-compatible endpoint)
ai:
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://llm-8sr4ofm58q8qaj4e.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  model:
    name: ${AI_MODEL_NAME:qwen3.7-plus-2026-05-26}

