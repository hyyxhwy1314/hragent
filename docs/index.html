<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HR-Agent 智能人力资源管理平台 - 文档中心">
  <title>HR-Agent 文档中心</title>
  <link rel="icon" href="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=HR+Agent+logo%2C+modern+minimalist+design%2C+blue+white+color+scheme%2C+flat+icon&image_size=square">
  <link rel="stylesheet" href="//unpkg.com/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//unpkg.com/docsify-dark-mode/dist/docsify-dark-mode.min.css">
</head>
<body>
  <div id="app"></div>

  <script src="//unpkg.com/docsify@4"></script>
  <script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/docsify-copy-code@2"></script>
  <script src="//unpkg.com/docsify-dark-mode/dist/docsify-dark-mode.min.js"></script>
  <script>
    window.$docsify = {
      name: 'HR-Agent',
      repo: 'https://github.com/hyyxhwy1314/hragent',
      logo: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=HR+Agent+logo%2C+modern+minimalist+design%2C+blue+white+color+scheme%2C+flat+icon&image_size=square',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      autoHeader: true,
      coverpage: false,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '没有找到结果',
        depth: 3
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '复制成功'
      },
      darkMode: {
        defaultTheme: 'light',
        buttonDarkText: '暗色模式',
        buttonLightText: '亮色模式',
        dark: {
          background: '#1a1a2e',
          highlight: '#162447',
          codeBackground: '#1f4068'
        }
      }
    }
  </script>
</body>
</html>
